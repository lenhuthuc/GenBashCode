# Every knob the pipeline reads. Override with --set a.b=c or a smaller config file
# that only lists what differs (see smoke.yaml / colab_t4.yaml / colab_a100.yaml).

seed: 42
run_name: default

paths:
  root: null          # null = auto-detect (paths.py: colab Drive / kaggle working / repo root)

sandbox:
  backend: auto        # auto | local | docker
  timeout: 10           # seconds per episode
  max_workers: 8

data:
  # If this path exists it is used as-is (already translated). If not, data-nl2bash downloads
  # NL2Bash and translates it itself through the vLLM server below (AGENT.md sections 2-3).
  nl2bash_dir: data/nl2bash_vi
  max_rows: null                        # null = all (~40k); a number = only the first N pairs (smoke)
  translator:
    server_url: http://localhost:8000/v1
    api_key: EMPTY
    model: Qwen/Qwen3.5-4B              # T4 16GB; colab_a100.yaml uses the 9B
    autostart: true                     # start scripts/start_vllm.sh if nothing answers, stop it after
    startup_timeout: 1800               # seconds: first run installs vllm + downloads the model
    chunk_size: 2000                    # rows per resumable chunk file
    max_workers: 64                     # concurrent requests so vLLM can batch
  noise_ratio: 0.30
  drop_r2_in_sft_nl2bash: true

templates:
  dir: templates
  n_train_per_template: 20
  n_test_per_template: 5
  test_frac: 0.15
  grpo_frac: 0.5          # of the non-test templates, this share goes to GRPO, the rest to SFT

diversity:               # python -m vishell diversity (needs Java for VnCoreNLP; CPU is enough)
  embed_model: VoVanPhuc/sup-SimCSE-VietNamese-phobert-base
  vncorenlp_dir: models/vncorenlp
  sem_percentile: 95      # same meaning = closer than 95% of cross-template pairs
  max_lexical: 0.5        # TF-IDF cosine and normalised BM25 must both be <= this
  min_good_pair_frac: 0.6 # template passes if >= 60% of its request pairs are good paraphrases
  min_requests: 10        # and it has at least this many distinct requests

verify:
  n_instances: 5
  max_fix_rounds: 3

reward:
  decision_coef: 1.0

models:
  base_model: Qwen/Qwen2.5-Coder-1.5B-Instruct
  sft_v1_dir: models/sft_v1            # pre-existing NL2Bash-vi LoRA adapter, if present

train:
  enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  max_len: 384
  lr: 2.0e-4
  epochs: 2
  scenarios_epochs: 1    # template data: 2 epochs memorised it (99.9% token acc), leaving GRPO no variety
  max_steps: -1          # -1 = derive from epochs
  per_device_bs: 8
  grad_accum: 8
  save_steps: 200
  eval_steps: 200
  dtype: auto             # auto | bf16 | fp16

grpo:
  dtype: auto
  use_vllm: true
  num_generations: 8
  temperature: 1.0       # sampling variety is GRPO's only learning signal
  undo_coef: 1.0         # r_undo weight in the grpo-undo arm (the grpo arm always uses 0)
  max_prompt_length: 256
  max_completion_length: 128
  lr: 1.0e-5
  max_steps: 300
  save_steps: 50

evaluate:
  systems: [base, sft_nl2bash, sft_scenarios, grpo, grpo_undo]
  baseline_system: sft_scenarios       # arm A; eval_comparison.json = every other system minus this
  api_base_env: VISHELL_API_BASE       # only run "api_large" system if this env var is set
  max_new_tokens: 128

demo:
  share: false
