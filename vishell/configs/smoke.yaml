# Smoke config: whole pipeline on a tiny slice, fast enough to catch errors early.
# Load with configs/default.yaml as base (cli.py merges default.yaml <- this file).
run_name: smoke

data:
  # A tiny bundled fixture lets the laptop smoke run skip translation (no GPU/vLLM there).
  # To smoke-test the translation stage itself on Kaggle/Colab, override:
  #   --set data.nl2bash_dir=data/nl2bash_vi     (path that does not exist -> translate)
  nl2bash_dir: tests/fixtures/nl2bash_vi_small.jsonl
  max_rows: 50                  # only used when translating: first 50 pairs
  translator:
    chunk_size: 25
    max_workers: 16

templates:
  n_train_per_template: 4
  n_test_per_template: 2

verify:
  n_instances: 3

train:
  enabled: false   # GPU steps (sft/merge/grpo/export) are skipped in `pipeline` on smoke
  max_steps: 10
  save_steps: 5
  eval_steps: 5
  per_device_bs: 4
  grad_accum: 1

grpo:
  num_generations: 4
  max_steps: 10
  save_steps: 5

evaluate:
  # base/sft_*/grpo need a loaded model (GPU); oracle/mock exercise the eval harness
  # itself without one, which is the point of a laptop smoke run.
  systems: [oracle, mock]
