[project]
name = "vishell"
version = "0.1.0"
description = "ViShell: Vietnamese NL -> bash with execute/probe/ask RL pipeline"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "bashlex>=0.18",
]

[project.optional-dependencies]
# Exact set verified end-to-end (SFT + GRPO) on Colab T4, 2026-09-27. Upgrade as a unit:
# unsloth caps transformers/trl, and trl 0.24 breaks on transformers 5.x.
train = [
  "unsloth==2026.9.11", "unsloth_zoo==2026.9.7", "trl==0.24.0", "transformers==4.57.6",
  "peft==0.20.0", "accelerate==1.14.0", "datasets==4.3.0", "tokenizers==0.22.2",
  "huggingface_hub==0.36.2", "torch==2.11.0", "torchao==0.18.0",
]
data = ["requests", "pandas"]
# Request classifier (XLM-R); same pins as `train` so both run in one Colab env.
classifier = ["transformers==4.57.6", "tokenizers==0.22.2", "torch==2.11.0", "sentencepiece", "scikit-learn"]
# envcheck: secret scan (regex + entropy) of the files a command touches
env = ["detect-secrets>=1.5"]
demo = ["gradio>=5,<6"]
diversity = ["py_vncorenlp", "scikit-learn"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["vishell*"]

[tool.setuptools.package-data]
"vishell.analyzer" = ["rules.yaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
